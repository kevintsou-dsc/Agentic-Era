<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 341" role="img" aria-label="插畫：一支微微傾斜、正在撥出的手機，旁邊一個問號">
  <!-- 策展插畫（非原刊圖）：a03「被掛電話的教宗」，配色取自全站色票 -->
  <rect width="846" height="341" fill="#e9e3d6"/>
  <circle cx="423" cy="170" r="150" fill="#cbdd7a" opacity=".3"/>

  <!-- 撥出中的手機：微微傾斜 -->
  <g transform="rotate(-10 380 170)">
    <rect x="310" y="40" width="140" height="260" rx="24" fill="#1f1d1a"/>
    <rect x="320" y="54" width="120" height="232" rx="14" fill="#f3eee4"/>
    <rect x="360" y="60" width="40" height="6" rx="3" fill="#1f1d1a"/>
    <text x="380" y="132" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="800" fill="#1f1d1a">撥號中…</text>
    <g fill="#2f5e35">
      <circle cx="362" cy="156" r="4"/><circle cx="380" cy="156" r="4" opacity=".6"/><circle cx="398" cy="156" r="4" opacity=".3"/>
    </g>
    <circle cx="380" cy="238" r="20" fill="#2f5e35"/>
    <path d="M371 229 q-3 10 5 18 q8 8 18 5 l2 -6 l-7 -4 l-3 3 q-6 -3 -9 -9 l3 -3 l-4 -7 z" fill="#ffffff"/>
  </g>
  <!-- 撥出的訊號波 -->
  <g fill="none" stroke="#2f5e35" stroke-width="5" stroke-linecap="round">
    <path d="M468 96 q16 14 12 34"/>
    <path d="M486 78 q28 24 20 58"/>
  </g>

  <!-- 問號 -->
  <text x="548" y="150" font-family="Georgia, serif" font-size="96" font-weight="700" fill="#c2413b" transform="rotate(12 548 150)">?</text>
</svg>
