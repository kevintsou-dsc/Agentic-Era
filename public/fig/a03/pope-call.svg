<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 846 341" role="img" aria-label="插畫：手機上一通已被掛斷的來電，來電者頭像是一頂教宗冠，聲紋旁打著問號，客服心想這是詐騙電話">
  <!-- 策展插畫（非原刊圖）：a03「被掛電話的教宗」，配色取自全站色票 -->
  <rect x="-140" width="846" height="341" fill="#e9e3d6"/>
  <circle cx="120" cy="70" r="90" fill="#cbdd7a" opacity=".35"/>
  <circle cx="500" cy="300" r="110" fill="#cbdd7a" opacity=".25"/>

  <!-- 手機 -->
  <g transform="translate(70 34)">
    <rect x="0" y="0" width="170" height="290" rx="26" fill="#1f1d1a"/>
    <rect x="10" y="14" width="150" height="262" rx="16" fill="#f3eee4"/>
    <rect x="62" y="20" width="46" height="6" rx="3" fill="#1f1d1a"/>
    <!-- 來電者：只畫一頂教宗冠，不畫人像 -->
    <circle cx="85" cy="92" r="38" fill="#e9e3d6" stroke="#d6ccba" stroke-width="2"/>
    <path d="M74 112 v14 M96 112 v14" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 112 Q62 86 76 72 L85 60 L94 72 Q108 86 106 112 Z" fill="#ffffff" stroke="#1f1d1a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M76 72 L85 84 L94 72" fill="none" stroke="#1f1d1a" stroke-width="2"/>
    <path d="M85 88 V108 M78 96 H92" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
    <path d="M64 112 H106" stroke="#c9a227" stroke-width="5" stroke-linecap="round"/>
    <text x="85" y="152" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="800" fill="#1f1d1a">未知來電</text>
    <text x="85" y="172" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="11" fill="#6b655c">「我想更改通訊地址…」</text>
    <!-- 通話已結束 -->
    <rect x="28" y="196" width="114" height="30" rx="15" fill="#f4d7d4"/>
    <text x="85" y="216" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="12" font-weight="800" fill="#c2413b">通話已結束 0:12</text>
    <circle cx="85" cy="250" r="16" fill="#c2413b"/>
    <path d="M75 252 q10 -9 20 0 l-3 4 l-4 -2 l0 -3 q-3 -1 -6 0 l0 3 l-4 2 z" fill="#ffffff"/>
  </g>

  <!-- 聲紋與問號 -->
  <g transform="translate(268 120)" stroke="#2f5e35" stroke-width="6" stroke-linecap="round">
    <path d="M0 50 v0"/><path d="M16 38 v24"/><path d="M32 20 v60"/><path d="M48 32 v36"/><path d="M64 10 v80"/><path d="M80 28 v44"/><path d="M96 40 v20"/><path d="M112 22 v56"/><path d="M128 44 v12"/>
  </g>
  <text x="300" y="104" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#c2413b" transform="rotate(-12 300 104)">?</text>
  <text x="392" y="236" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#c2413b" transform="rotate(10 392 236)">?</text>

  <!-- 客服的念頭 -->
  <g transform="translate(400 56)">
    <path d="M0 18 Q0 0 20 0 H128 Q146 0 146 18 V52 Q146 70 128 70 H40 L22 88 L26 70 H20 Q0 70 0 52 Z" fill="#ffffff" stroke="#1f1d1a" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="73" y="32" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="16" font-weight="800" fill="#1f1d1a">詐騙電話？</text>
    <text x="73" y="54" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="11" fill="#6b655c">聲音可以被 AI 複製</text>
  </g>
  <!-- 客服 -->
  <g transform="translate(456 176)">
    <circle cx="30" cy="30" r="22" fill="#1f1d1a"/>
    <path d="M4 34 q0 -32 26 -32 q26 0 26 32" fill="none" stroke="#2f5e35" stroke-width="5"/>
    <rect x="0" y="30" width="10" height="16" rx="4" fill="#2f5e35"/>
    <path d="M10 44 q10 14 22 12" fill="none" stroke="#2f5e35" stroke-width="3"/>
    <path d="M-4 120 q2 -46 34 -46 q32 0 34 46 z" fill="#1f1d1a"/>
  </g>
</svg>
